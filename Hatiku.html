<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* =========================
   WALLPAPER
========================= */

body {
    background-image:
        linear-gradient(
            rgba(0,0,0,0.25),
            rgba(0,0,0,0.40)
        ),
        url("1000194648.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* =========================
   CANVAS
========================= */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =========================
   TOMBOL MUSIK
========================= */

#musicButton {
    position: fixed;
    top: 25px;
    right: 20px;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: rgba(255,23,68,0.9);
    color: white;

    font-size: 21px;

    box-shadow:
        0 0 10px #ff1744,
        0 0 25px rgba(255,0,60,0.6);

    z-index: 10;
    cursor: pointer;
}

/* =========================
   TOMBOL PESAN
========================= */

#openMessage {
    position: fixed;

    bottom: 40px;
    left: 50%;

    transform: translateX(-50%);

    padding: 13px 24px;

    border: none;
    border-radius: 30px;

    background: #ff1744;
    color: white;

    font-size: 16px;
    font-weight: bold;

    box-shadow:
        0 0 10px #ff1744,
        0 0 25px rgba(255,0,60,0.7);

    cursor: pointer;

    z-index: 10;

    display: none;

    animation: buttonPulse 1.5s infinite;
}

@keyframes buttonPulse {
    0%,100% {
        transform: translateX(-50%) scale(1);
    }

    50% {
        transform: translateX(-50%) scale(1.08);
    }
}

/* =========================
   POPUP
========================= */

#messageBox {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,0.78);

    z-index: 20;
}

/* =========================
   KOTAK PESAN
========================= */

.message {
    width: 85%;
    max-width: 380px;

    padding: 30px 25px;

    text-align: center;

    background: rgba(15,15,15,0.95);

    color: white;

    border: 1px solid #ff1744;

    border-radius: 25px;

    box-shadow:
        0 0 15px #ff1744,
        0 0 40px rgba(255,0,60,0.5);

    animation: messageIn 0.5s ease;
}

@keyframes messageIn {
    from {
        transform: scale(0.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* =========================
   HATI
========================= */

.bigHeart {
    font-size: 55px;

    animation: heartBeat 1s infinite;

    filter:
        drop-shadow(0 0 8px red)
        drop-shadow(0 0 20px red);
}

@keyframes heartBeat {
    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.25);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.2);
    }
}

/* =========================
   JUDUL PESAN
========================= */

.message h2 {
    color: #ff1744;

    margin-bottom: 15px;

    text-shadow:
        0 0 8px #ff1744;
}

/* =========================
   ISI PESAN
========================= */

.message p {
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 20px;
}

/* =========================
   TOMBOL TUTUP
========================= */

#closeMessage {
    margin-top: 10px;

    padding: 9px 20px;

    border: none;
    border-radius: 20px;

    background: #ff1744;
    color: white;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 10px rgba(255,0,60,0.6);
}
</style>
</head>

<body>

<!-- =========================
     AUDIO
========================= -->

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<!-- TOMBOL MUSIK -->

<button id="musicButton">
    🎵
</button>


<!-- CANVAS -->

<canvas id="canvas"></canvas>


<!-- TOMBOL PESAN -->

<button id="openMessage">
    💌 Buka perasaanku
</button>


<!-- =========================
     POPUP PESAN
========================= -->

<div id="messageBox">

    <div class="message">

        <div class="bigHeart">
            ❤️
        </div>

        <h2>
            Untuk Sayangku
        </h2>

        <p>
            Terima kasih sayangku sifa sudah menjadi bagian
            dari cerita indah dalam hidupku.
            Semoga kita selalu punya alasan
            untuk tersenyum bersama. ❤️
        </p>

        <button id="closeMessage">
            Tutup
        </button>

    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   VARIABEL HATI
========================= */

let jumlahHati = 15;

let hatiSekarang = 0;

let progress = 0;

let selesai = false;

let pulse = 1;

let pulseDirection = 1;


/* =========================
   TITIK HATI
========================= */

function heartPoint(t, scale) {

    const x =
        16 *
        Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}


/* =========================
   GAMBAR HATI
========================= */

function drawHeart(scale, progress) {

    ctx.beginPath();

    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;

    const total = 360;

    const sampai =
        Math.floor(
            total * progress
        );

    const ukuran =
        scale * pulse;


    for (
        let i = 0;
        i <= sampai;
        i++
    ) {

        const t =
            (i / total) *
            Math.PI * 2;

        const p =
            heartPoint(
                t,
                ukuran
            );


        if (i === 0) {

            ctx.moveTo(
                centerX + p.x,
                centerY + p.y
            );

        } else {

            ctx.lineTo(
                centerX + p.x,
                centerY + p.y
            );
        }
    }

    ctx.stroke();
}


/* =========================
   ANIMASI
========================= */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.strokeStyle =
        "#ff1744";

    ctx.lineWidth = 2.5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";


    const ukuranDasar =
        Math.min(
            canvas.width,
            canvas.height
        ) / 80;


    /* HATI YANG SUDAH SELESAI */

    for (
        let i = 0;
        i < hatiSekarang;
        i++
    ) {

        drawHeart(

            ukuranDasar *
            (i + 1) *
            0.1,

            1
        );
    }


    /* HATI YANG SEDANG DIGAMBAR */

    if (
        hatiSekarang <
        jumlahHati
    ) {

        drawHeart(

            ukuranDasar *
            (hatiSekarang + 1) *
            0.1,

            progress
        );


        progress += 0.025;


        if (progress >= 1) {

            progress = 0;

            hatiSekarang++;
        }

    } else {

        selesai = true;
    }


    /* DENYUT */

    if (selesai) {

        pulse +=
            0.006 *
            pulseDirection;


        if (pulse >= 1.08) {
            pulseDirection = -1;
        }


        if (pulse <= 1) {
            pulseDirection = 1;
        }


        document.getElementById(
            "openMessage"
        ).style.display = "block";
    }


    requestAnimationFrame(
        animate
    );
}


animate();


/* =========================
   PESAN
========================= */

const openMessage =
    document.getElementById(
        "openMessage"
    );

const closeMessage =
    document.getElementById(
        "closeMessage"
    );

const messageBox =
    document.getElementById(
        "messageBox"
    );


openMessage.addEventListener(
    "click",
    function() {

        messageBox.style.display =
            "flex";

    }
);


closeMessage.addEventListener(
    "click",
    function() {

        messageBox.style.display =
            "none";

    }
);


messageBox.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            messageBox
        ) {

            messageBox.style.display =
                "none";
        }
    }
);


/* =========================
   MUSIK
========================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

let musicPlaying = false;


/* KLIK TOMBOL MUSIK */

musicButton.addEventListener(
    "click",
    function() {

        if (!musicPlaying) {

            music.play();

            musicPlaying = true;

            musicButton.innerHTML = "🔊";

        } else {

            music.pause();

            musicPlaying = false;

            musicButton.innerHTML = "🎵";
        }

    }
);

</script>

</body>
</html>
